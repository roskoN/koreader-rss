name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build Kindle release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cross compiler
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build plugin package
        run: make package
      - name: Create ZIP archive
        id: archive
        run: |
          archive="rssreader-${GITHUB_REF_NAME#v}.zip"
          (cd dist && zip -r "../$archive" rssreader.koplugin)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rssreader-${{ github.ref_name }}
          path: ${{ steps.archive.outputs.archive }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" --title "RSS Reader $GITHUB_REF_NAME" --generate-notes
